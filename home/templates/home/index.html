{% extends "base.html" %}

{% load static %}


{% block page_header %}
<div class="container header-container">
    <div class="row">
        <div class="col"></div>
    </div>
</div>
{% endblock %}

{% block content %}
<main class="d-flex flex-column"> 
<div class="background-image" style="background: url('{% static 'images/background.jpg' %}') no-repeat center center fixed; background-size: cover; width: 100%; top: 0; left: 0;">
    <div class="container h-100">
        <div class="row h-100 justify-content-md-end justify-content-center align-items-center text-center text-md-end">
            <div class="col-12 col-md-6 text-white">
                <h1 class="display-4 logo-font">Welcome to Moonroot Market</h1>
                <p class="lead">
                    Potions. Crystals. Ritual tools. Everything you need for your sacred space.
                </p>
                <div class="my-5">
                    <h2>
                        <a href="{% url 'products' %}" class="btn btn-lg rounded-0 text-uppercase py-3 shop-now-button">
                            Enter the Circle
                        </a>
                    </h2>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
{% endblock %}
