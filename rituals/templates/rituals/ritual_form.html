{% extends "base.html" %}
{% load static %}


{% block content %}
<div class="container my-4">
  <div class="p-4 rounded" style="background-color: #2e2d2d; max-width: 600px; margin: 0 auto; color: white;">
    <h2 class="mb-4">{{ action }} Ritual</h2>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3 row align-items-center">
        <label for="{{ field.id_for_label }}" class="col-sm-4 col-form-label fw-semibold text-white">{{ field.label }}</label>
        <div class="col-sm-8">
          {{ field }}
          {% if field.help_text %}
            <div class="form-text text-muted">{{ field.help_text }}</div>
          {% endif %}
          {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
      <div class="mt-4">
        <button type="submit" class="btn btn-success">{{ action }}</button>
        <a href="{% url 'ritual_list' %}" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
