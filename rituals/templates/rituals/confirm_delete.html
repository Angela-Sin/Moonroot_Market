{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h2>Delete Ritual</h2>
    <p>Are you sure you want to delete the ritual: <strong>{{ ritual.name }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'ritual_detail' ritual.id %}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
</div>
{% endblock %}
